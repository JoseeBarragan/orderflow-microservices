syntax = "proto3";

package inventory;

service InventoryService {
  rpc GetAll(ListProductsQuery) returns (GetAllResponse);
}

message ListProductsQuery {
  int32 limit = 1;
  int32 offset = 2;
}

message Product {
  string id = 1;
  string name = 2;
  int64 unitPriceCents = 3;
  int32 availableStock = 4;
}

message GetAllResponse {
  repeated Product items = 1;
}
