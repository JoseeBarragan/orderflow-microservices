services: 
  gateway:
    build:
      context: ./services/api-gateway
      dockerfile: dockerfile
    environment:
      - INVENTORY_URL=inventory:5005
      - ORDER_URL=order:5006
      - PAYMENT_URL=payment:5007
    ports:
      - "3000:3000"

  inventory: 
    build: 
      context: ./services/inventory-service
      dockerfile: dockerfile
      args:
        - DATABASE_URL=postgresql://inventory-user:inventory-pass@inventory-db:5432/inventory-db
    env_file:
      - ./services/inventory-service/.env
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq: 
        condition: service_healthy
  
  order: 
    build: 
      context: ./services/order-service
      dockerfile: dockerfile
      args:
        - DATABASE_URL=postgresql://orders_user:orders_pass@orders-db:5432/orders_db
    env_file:
      - ./services/order-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-db:
        condition: service_healthy

  payment:
    build: 
      context: ./services/payment-service
      dockerfile: dockerfile
      args:
        - DATABASE_URL=postgresql://payment_user:payment_pass@payment-db:5432/payment_db
    env_file: 
      - ./services/payment-service/.env
    depends_on:
      rabbitmq: 
        condition: service_healthy
      payment-db: 
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - '5672:5672'   
      - '15672:15672'  
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory-user 
      POSTGRES_PASSWORD: inventory-pass 
      POSTGRES_DB: inventory-db
    ports: 
      - '5432:5432'
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory-user -d inventory-db']
      interval: 5s
      timeout: 5s
      retries: 5
  
  orders-db:
    image: postgres:16
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    ports:
      - '5433:5432'
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders_user -d orders_db']
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16
    environment: 
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports: 
      - 5434:5432
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payment_user -d payment_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payment_db_data:
  orders_db_data:
  inventory_db_data:

